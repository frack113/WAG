[package]
name = "malware-traces-generator"
version = "1.2.0"
edition = "2024"
rust-version = "1.85.0"
description = "Generate malware traces for detection tests"
documentation = "https://frack113.github.io/MalwareTracesGenerator/"
repository = "https://github.com/frack113/MalwareTracesGenerator/"
license = "GPL-3.0-or-later"
keywords = [
  "malware-detection",
  "blueteam",
  "windows",
  "artifacts-generation",
  "rust",
]
categories = ["command-line-utilities"]

[[bin]]
name = "mtg"
path = "./src/main.rs"

[dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Security",
  "Win32_System_Services",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
] }

clap = { version = "=4.6.1", features = ["derive"] }
toml = { version = "=1.1.2" }
serde = { version = "1.0.219", features = ["derive"] }
indicatif = { version = "=0.18.4" }
console = { version = "=0.16.3" }
toml-span = { version = "=0.7.1" }
thiserror = { version = "=2.0.18" }
miette = { version = "=7.6.0", features = ["derive", "fancy"] }
url = { version = "=2.5.8" }
uuid = { version = "=1.23.4", features = ["v4"] }

[build-dependencies]
embed-resource = { version = "=3.0.9" }

[profile.release]
opt-level = 3
debug = false
strip = true
debug-assertions = false
overflow-checks = false
lto = false
panic = "unwind"
incremental = false
codegen-units = 16
rpath = false
